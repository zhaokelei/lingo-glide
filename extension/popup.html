<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <div class="status">
      <span class="dot" id="dot"></span>
      <div class="status-txt">
        <div class="status-main" id="statusMain">检测中…</div>
        <div class="status-sub" id="statusSub">http://127.0.0.1:8080/v1</div>
      </div>
      <button class="mini" id="retest">重测</button>
    </div>

    <details class="svc" id="svcBox">
      <summary>服务设置 <span class="svc-sum" id="svcSum">127.0.0.1:8080 · hy-mt2</span></summary>
      <div class="svc-body">
        <label class="svc-field">
          <span>服务地址（base_url）</span>
          <input id="pEndpoint" type="text" spellcheck="false" placeholder="http://127.0.0.1:8080">
        </label>
        <label class="svc-field">
          <span>API Key</span>
          <div class="key-row">
            <input id="pApiKey" type="password" spellcheck="false" autocomplete="off" placeholder="本地服务可留空">
            <span id="pKeyMask" class="key-mask" hidden></span>
            <button id="pToggleKey" type="button" class="mini">显示</button>
          </div>
        </label>
        <label class="svc-field">
          <span>模型名</span>
          <input id="pModel" type="text" spellcheck="false" placeholder="hy-mt2">
        </label>
        <div class="svc-foot">
          <button id="pClearKey" type="button" class="mini">清除 Key</button>
          <span id="pSaveHint" class="svc-hint">Key 只存本机</span>
        </div>
      </div>
    </details>

    <div class="langbar">
      <div class="lang-src">
        <div class="lang-label">源语言</div>
        <select id="sourceLang" aria-label="源语言"></select>
      </div>
      <div class="arrow">→</div>
      <div class="lang-tgt">
        <div class="lang-label">目标语言</div>
        <select id="target" aria-label="目标语言"></select>
      </div>
    </div>

    <div class="dispbar">
      <div class="disp-item">
        <div class="lang-label">显示模式</div>
        <select id="pageMode" aria-label="显示模式">
          <option value="dual">双语对照</option>
          <option value="target">仅译文</option>
          <option value="hover">悬停显示</option>
        </select>
      </div>
      <div class="disp-item">
        <div class="lang-label">译文样式</div>
        <select id="stylePreset" aria-label="译文样式">
          <option value="line">左竖线</option>
          <option value="underline">虚线下划线</option>
          <option value="card">卡片</option>
        </select>
      </div>
    </div>

    <button class="primary" id="mainBtn">翻译本页</button>
    <div class="progress" id="progress"></div>

    <div class="switch-list">
      <label class="row"><span>段落点击翻译（Ctrl + 点击）</span><input type="checkbox" id="swPara"></label>
      <label class="row"><span>三空格翻译</span><input type="checkbox" id="swTriple"></label>
      <label class="row"><span>划词翻译图标</span><input type="checkbox" id="swSelection"></label>
      <label class="row"><span>页面悬浮球</span><input type="checkbox" id="swBall"></label>
      <label class="row"><span>英文页自动提示</span><input type="checkbox" id="swAutoPrompt"></label>
      <label class="row"><span>本网站禁用扩展</span><input type="checkbox" id="swSiteOff"></label>
      <label class="row"><span>总是翻译这个网站</span><input type="checkbox" id="swAlways"></label>
    </div>

    <div class="hintline" id="shortcutHint">输入框翻译：⌘ ⇧ Enter</div>

    <div class="cache">
      <div class="cache-info">
        <span class="cache-title">翻译缓存</span>
        <span class="cache-num" id="cacheNum">缓存 0 条 · 0 KB · 命中率 0%</span>
      </div>
      <button class="mini" id="clearCache">清除缓存</button>
    </div>

    <div class="foot">
      <button class="link" id="openOptions">选项</button>
      <span class="ver">v<span id="ver">1.0.0</span> · 纯本地</span>
    </div>
  </div>
  <div class="tip" id="tip"></div>
  <script src="popup.js"></script>
</body>
</html>
