<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>中文测试页 · 本地翻译</title>
<style>
body{font:16px/1.65 -apple-system,PingFang SC,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#222;background:#fbfaf7}
h1{font-size:22px}
textarea{width:100%;height:70px;font-size:15px;padding:8px;margin:10px 0}
</style>
</head>
<body>
<h1 id="z0">中文测试页</h1>
<p id="z1">本地翻译扩展只把文字发送到本机的推理服务，不会上传到互联网。</p>
<p id="z2">模型在纯 CPU 上运行，速度大约每秒十四个词元，因此请求需要排队执行。</p>
<p id="z3">选中一段中文后，扩展会把它翻译成英文，并在气泡里显示方向标签。</p>
<p id="z4">整页翻译时，段落之间的空行会被保留，不允许把多段合并成一段。</p>
<p id="z5">如果本地服务没有启动，扩展会提示你先双击桌面上的启动脚本。</p>
<textarea id="zin" placeholder="在这里输入中文，用来测试三空格翻译"></textarea>
</body>
</html>
